# Render Deployment Configuration
# Deploy Frontend and Backend with FREE HTTPS
# Database will be created separately or use existing one

services:
  # Backend API Service
  - type: web
    name: crm-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard to existing database
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://crm-frontend.onrender.com  # Update with actual frontend URL after deployment
    healthCheckPath: /api/health
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: crm-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://crm-backend.onrender.com/api  # Update with actual backend URL after deployment
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    autoDeploy: true
