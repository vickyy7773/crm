# Render Deployment Configuration
# Deploy Frontend, Backend, and PostgreSQL Database with FREE HTTPS

databases:
  # PostgreSQL Database (FREE)
  - name: crm-database
    databaseName: crm_database
    user: crm_admin
    region: singapore
    plan: free
    ipAllowList: [] # Allow connections from all Render services

services:
  # Backend API Service
  - type: web
    name: crm-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: crm-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://crm-frontend.onrender.com  # Update with actual frontend URL after deployment
    healthCheckPath: /api/health
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: crm-frontend
    runtime: static
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://crm-backend.onrender.com/api  # Update with actual backend URL after deployment
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    autoDeploy: true
